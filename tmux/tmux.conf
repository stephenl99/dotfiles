# ~/.tmux.conf — starter config (prefix is still Ctrl-b)

set -g mouse on                 # click panes, scroll with the mouse wheel
set -g base-index 1             # windows start at 1
setw -g pane-base-index 1       # panes start at 1
setw -g mode-keys vi            # vi keys in scroll/copy mode (Ctrl-b [)
set -sg escape-time 10          # stops nvim's Esc from lagging
set -g history-limit 10000      # more scrollback
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # correct colors in nvim
set -g focus-events on          # lets nvim notice file changes

# move between panes with prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# open splits in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# reload this file with prefix + r
bind r source-file ~/.tmux.conf \; display "reloaded ~/.tmux.conf"

# make the active pane obvious (bright border)
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=colour45,bold"
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_current_command} "

# Ctrl-h/j/k/l: move between tmux panes, or between nvim windows when nvim is focused
# (pairs with the vim-tmux-navigator plugin in nvim)
# Detects nvim using tmux's own knowledge of the pane's command (the usual ps|grep
# version from the plugin README doesn't work with macOS's grep).
is_vim="#{m/ri:^g?(view|l?n?vim?x?|fzf)(diff)?$,#{pane_current_command}}"
bind -n C-h if-shell -F "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell -F "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell -F "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell -F "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Ctrl-l is now taken, so prefix + Ctrl-l clears the screen instead
bind C-l send-keys C-l
